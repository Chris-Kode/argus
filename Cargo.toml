[workspace]
resolver = "3"
members = [
    "crates/argus",
    "crates/argus_ui",
    "crates/argus_git",
    "crates/argus_diff",
    "crates/argus_highlight",
    "crates/argus_runs",
    "crates/argus_store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/Chris-Kode/argus"
authors = ["Christian Andrés Bacho"]

[workspace.dependencies]
# Internal crates.
argus_diff = { path = "crates/argus_diff" }
argus_git = { path = "crates/argus_git" }
argus_highlight = { path = "crates/argus_highlight" }
argus_runs = { path = "crates/argus_runs" }
argus_store = { path = "crates/argus_store" }
argus_ui = { path = "crates/argus_ui" }

# GPUI is not reliably published on crates.io, so it is pinned to one exact Zed
# commit. Both crates must always point at the same rev. See CONTRIBUTING.md for
# the pinned rev, the Zed tag it belongs to, and how to bump it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "fb69067729cb16a7f6135e2c1600c26a28c59659", features = ["font-kit", "wayland", "x11"] }

# Third-party dependencies shared by the workspace. Services get filled in by
# later issues; keep versions here so every crate uses the same ones.
anyhow = "1.0.104"
gix = "0.89.0"
# The imara-diff fork maintained by gitoxide; the same crate gix diffs with.
imara-diff = { package = "gix-imara-diff", version = "0.3.1" }
# Markdown parsing of comment bodies (MIT). No default features: the HTML
# renderer and its CLI are not needed.
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"
# Tree-sitter and the bundled grammars of `argus_highlight` (all MIT).
tree-sitter = "0.27.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-md = "0.5.3"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-swift = "0.7.4"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Grapheme boundaries for the comment editor's caret.
unicode-segmentation = "1.13.3"
uuid = { version = "1.28.0", features = ["serde", "v7"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
